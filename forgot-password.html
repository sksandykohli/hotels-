<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – Hotel Paradise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
  <h1 style="text-align:center;">Hotel Paradise</h1>
  <div class="hamburger" onclick="toggleMenu()">
    <i class="fas fa-bars"></i>
  </div>
  <nav id="mainNav">
    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="register.html" id="registerLink">Register</a></li>
      <li><a href="login.html" id="loginLink">Login</a></li>
      <li id="userGreeting" style="display: none;"></li>
      <li><a href="#" id="logoutLink" style="display: none;" onclick="logout()">Logout</a></li>
    </ul>
  </nav>
</header>

  <section class="form-section">
    <h2>Reset Password</h2>
    <div class="booking-form">
      <input type="email" id="resetEmail" placeholder="Enter your registered email">
      <input type="password" id="newPassword" placeholder="Enter new password">
      <button onclick="resetPassword()">Reset Password</button>
    </div>
  </section>

  <script>
    function resetPassword() {
      const email = document.getElementById("resetEmail").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      let users = JSON.parse(localStorage.getItem("hotelUsers")) || [];

      const userIndex = users.findIndex(u => u.email === email);
      if (userIndex === -1) {
        alert("No account found with this email.");
        return;
      }

      users[userIndex].password = newPassword;
      localStorage.setItem("hotelUsers", JSON.stringify(users));
      alert("Password reset successful! You can now login.");
      window.location.href = "login.html";
    }

  function logout() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
  }
  function toggleMenu() {
    const nav = document.querySelector("nav ul");
    nav.classList.toggle("show");
  }

  </script>
</body>
</html>
